<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <title>Contacto</title>
  </head>
  <body>
    <header class="cabeza-formulario">
      <h2 class="cabeza-formulario">
        <a href="./contacto.html">Contacto</a>
      </h2>
      <h2><a href="../index.html">Inicio</a></h2>
    </header>
    <main>
      <!-- modify this form HTML and place wherever you want your form -->
      <form
        action="https://formspree.io/f/mvzvqraw"
        method="POST"
        ,
        class="formulario"
      >
        <label>
          <p class="texto-formulario">Email:</p>
          <input type="email" name="email" />
        </label>
        <label>
          <p class="texto-formulario">Tu nombre:</p>
          <input name="name" />
        </label>
        <label>
          <p class="texto-formulario">Tu mensaje:</p>
          <textarea name="message"></textarea>
        </label>
        <!-- your other form fields go here -->
        <button type="submit" , class="btn-formulario">Enviar</button>
      </form>
    </main>
    <footer>
      <p>&copy Todos los derechos reservados. 2026</p>
      <div>
        <img src="../img/talento tech.png" />
        <img src="../img/Instagram_icon.png" />
      </div>
    </footer>
